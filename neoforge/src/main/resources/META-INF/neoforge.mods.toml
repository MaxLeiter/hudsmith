modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "${issues}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${homepage}"
${neoforge_logo_key} = "assets/hudsmith/icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}'''
# Client-only: servers neither need it nor care whether clients have it.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "vellum"
type = "required"
versionRange = "[${vellum_version},)"
ordering = "NONE"
side = "CLIENT"
