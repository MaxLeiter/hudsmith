# Important: every field used in resource templates must be added to the expandProps map in
# build-logic/src/main/groovy/multiloader-common.gradle
# Per-Minecraft-version settings (Minecraft, Java, loader and API versions) are in stonecutter.properties.toml.

# Project
version=0.1.0
group=com.maxleiter.hudsmith

# Common
mod_name=Hudsmith
mod_author=Max Leiter
mod_id=hudsmith
license=MIT
credits=
description=A HUD you write yourself: coordinates, biome, light, durability and more, laid out in a text file, or in HTML and CSS.
homepage=https://github.com/MaxLeiter/hudsmith
issues=https://github.com/MaxLeiter/hudsmith/issues

# Publishing (build-logic multiloader-publish.gradle, .github/workflows/release.yml)
# The tokens are never kept here: they come from the environment (MODRINTH_TOKEN, CURSEFORGE_TOKEN).
# Set the project ids once the Modrinth and CurseForge projects exist.
modrinth_id=wqsBV6Ac
curseforge_id=1768167
# The release type of versions without an -alpha or -beta suffix: alpha, beta or release.
release_type=release

# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false
org.gradle.caching=true
# The build scripts are Groovy; this silences Stonecutter's suggestion to move them to Kotlin.
dev.kikugie.stonecutter.hard_mode=true
junit_version=6.1.3
